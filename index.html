<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">

<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{--bg:#0F1417;--sf:#171D21;--sa:#1B2226;--bd:#262E33;--bl:#323C42;--tx:#E8EAEB;--tm:#8B959B;--tf:#5C666C;--ac:#E8A33D;--ok:#4FAE7C;--er:#E1584A;--in:#5B8DBE}

body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);margin:0;overflow:hidden}

::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:var(--bl);border-radius:4px}::-webkit-scrollbar-track{background:transparent}

input:focus,select:focus,textarea:focus{border-color:var(--ac)!important;outline:none}

.app{display:flex;width:100vw;height:100vh}

.sb{width:220px;flex-shrink:0;border-right:1px solid var(--bd);background:var(--sf);display:flex;flex-direction:column}

.sb-hd{padding:20px;border-bottom:1px solid var(--bd)}

.sb-t{font-size:14px;font-weight:600;letter-spacing:.5px}.sb-st{font-size:12px;color:var(--tf);margin-top:2px}

.sb-nav{flex:1;padding:12px 0}

.nb{width:100%;display:flex;align-items:center;gap:10px;padding:10px 20px;font-size:14px;text-align:left;border:none;cursor:pointer;background:0 0;color:var(--tm);border-right:2px solid transparent;transition:all .15s;font-family:inherit}

.nb:hover{color:var(--tx);background:rgba(232,163,61,.04)}.nb.on{color:var(--ac);background:rgba(232,163,61,.08);border-right-color:var(--ac)}

.sb-ft{padding:16px;border-top:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}

.mn{flex:1;padding:24px;overflow-y:auto}

.cd{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:20px}.cd.np{padding:0;overflow:hidden}

.bg{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:4px}

.bg-ok{background:rgba(79,174,124,.14);color:var(--ok)}.bg-er{background:rgba(225,88,74,.14);color:var(--er)}.bg-mt{background:rgba(139,149,155,.14);color:var(--tm)}.bg-ac{background:rgba(232,163,61,.14);color:var(--ac)}

.bt{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;padding:8px 12px;border-radius:6px;border:none;cursor:pointer;transition:opacity .15s;font-family:inherit}

.bt:hover{opacity:.85}.bt:disabled{opacity:.4;cursor:not-allowed}

.bt-p{background:var(--ac);color:#1A1204}.bt-g{background:0 0;color:var(--tx);border:1px solid var(--bd)}.bt-d{background:0 0;color:var(--er);border:1px solid rgba(225,88,74,.4)}

.ip,.sl,.ta{width:100%;font-size:14px;padding:8px 12px;border-radius:6px;border:1px solid var(--bd);background:var(--sa);color:var(--tx);font-family:inherit}.ta{resize:vertical;min-height:70px}

.fd{margin-bottom:12px}.fl{display:block;font-size:12px;font-weight:500;color:var(--tm);margin-bottom:4px}

table{width:100%;border-collapse:collapse;font-size:14px}thead tr{background:var(--sa)}th{text-align:left;padding:12px 16px;font-weight:500;color:var(--tf);font-size:13px}

td{padding:12px 16px;border-top:1px solid var(--bd)}tr:hover td{background:rgba(255,255,255,.015)}

.mo{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,8,9,.65)}

.md{width:100%;max-width:440px;background:var(--sf);border:1px solid var(--bl);border-radius:8px;max-height:85vh;overflow-y:auto}

.mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bd)}.mh h3{flex:1;font-size:16px;font-weight:600}

.mc{background:none;border:none;cursor:pointer;color:var(--tm);font-size:18px;padding:4px}.mb{padding:20px}

.kg{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:24px}

.kc{padding:16px!important}.kl{font-size:12px;color:var(--tf)}.kv{font-size:20px;font-weight:600;font-family:'IBM Plex Mono',monospace;margin-top:4px}

.cg{display:grid;grid-template-columns:2fr 1fr;gap:16px}

.hr{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}

.mono{font-family:'IBM Plex Mono',monospace}

.lk{color:var(--in);text-decoration:underline dotted;cursor:pointer;background:none;border:none;font:inherit}

.fe{display:flex;gap:8px;justify-content:flex-end}

.ax{display:flex;gap:8px;justify-content:flex-end}

.ib{background:none;border:none;cursor:pointer;font-size:14px;padding:4px}

.ai{display:flex;align-items:flex-start;gap:8px;font-size:14px;color:var(--tm);margin-bottom:10px}

async function loadFromCloud(){
  if(!sb) return null;
  try {
    var res = await sb.from('app_state').select('data').eq('id', ROW_ID).single();

  } catch(e){ console.warn('loadFromCloud excepción', e); return null; }
}
/* Guardar estado en Supabase (async, fire-and-forget). */
async function saveToCloud(data){
  if(!sb) return;
  try { await sb.from('app_state').upsert({ id: ROW_ID, data: data, updated_at: new Date().toISOString() }); }
  catch(e){ console.warn('saveToCloud excepción', e); }
}

  set: function(k, v) {

    try { localStorage.setItem(k, v); }

    catch(e) { _mem[k] = v; }

  }

};

  try { var s = store.get(STORAGE_KEY); if(s) return JSON.parse(s); } catch(e) {}

/* Generic UI */

function Badge(p){

  var m={'success':'bg-ok','danger':'bg-er','muted':'bg-mt','accent':'bg-ac'};

  return h('span',{className:'bg '+(m[p.tone]||'bg-mt')},p.children);

}

function Btn(p){

  var m={primary:'bt-p',ghost:'bt-g',danger:'bt-d'};

  return h('button',{type:p.type||'button',disabled:p.disabled,className:'bt '+(m[p.variant]||'bt-p'),onClick:p.onClick,style:p.style},p.children);

}

function Modal(p){

  return h('div',{className:'mo',onClick:p.onClose},

    h('div',{className:'md',onClick:function(e){e.stopPropagation()}},

      h('div',{className:'mh'},h('h3',null,p.title),h('button',{className:'mc',onClick:p.onClose},'\u2715')),

      h('div',{className:'mb'},p.children)

    )

  );

}

function Field(p){return h('div',{className:'fd'},h('label',{className:'fl'},p.label),p.children)}

function ConfirmDel(p){

  return h(Modal,{title:'Confirmar eliminaci\u00f3n',onClose:p.onCancel},

    h('p',{style:{fontSize:14,color:'var(--tm)',marginBottom:20}},'\u00bfSeguro que deseas eliminar ',h('strong',{style:{color:'var(--tx)'}},p.label),'? No se puede deshacer.'),

    h('div',{className:'fe'},h(Btn,{variant:'ghost',onClick:p.onCancel},'Cancelar'),h(Btn,{variant:'danger',onClick:p.onConfirm},'Eliminar'))

  );

}

/* ===== DASHBOARD ===== */

function DashboardView(p){

  var data=p.data;

  var months=[];var seen={};data.costs.forEach(function(c){if(!seen[c.month]){seen[c.month]=1;months.push(c.month)}});months.sort();

  var lastM=months[months.length-1]||'';

  var gastoMes=0;data.costs.forEach(function(c){if(c.month===lastM)gastoMes+=c.net});

  var credRest=0;data.credits.forEach(function(c){credRest+=(c.total-c.consumed)});

  var chartData=months.map(function(m){var t=0;data.costs.forEach(function(c){if(c.month===m)t+=c.net});return{mes:m.slice(5)+'/'+m.slice(2,4),gasto:Math.round(t)}});



  var alerts=[];

  data.credits.forEach(function(c){

    var dl=daysUntil(c.endDate);var acc=null;

    data.accounts.forEach(function(a){if(a.id===c.accountId)acc=a});

    var pct=c.total>0?((c.total-c.consumed)/c.total)*100:0;

    if(dl<=30)alerts.push({type:dl<0?'danger':'warning',text:'Cr\u00e9dito de '+(acc?acc.name:'cuenta')+' vence en '+dl+' d\u00eda(s)'});

    if(pct<20)alerts.push({type:'warning',text:'Cr\u00e9dito de '+(acc?acc.name:'cuenta')+' tiene solo '+pct.toFixed(0)+'% de saldo'});

  });



  var kpis=[

    {label:'Total PMAs',value:data.pmas.length},

    {label:'Total Cuentas',value:data.accounts.length},

    {label:'Total Clientes',value:data.clients.length},

    {label:'Gasto del mes',value:fmtUSD(gastoMes)},

    {label:'Cr\u00e9ditos restantes',value:fmtUSD(credRest)}

  ];



  /* Simple bar chart using SVG */

  var maxVal=1;chartData.forEach(function(d){if(d.gasto>maxVal)maxVal=d.gasto});

  var barW=Math.floor(400/chartData.length)-8;

  var chartH=200;



  return h('div',null,

    h('h1',{style:{fontSize:18,fontWeight:600,marginBottom:4}},'Dashboard'),

    h('p',{style:{fontSize:14,color:'var(--tm)',marginBottom:24}},'Resumen general de PMAs, cuentas y facturaci\u00f3n.'),

    h('div',{className:'kg'},kpis.map(function(k){

      return h('div',{key:k.label,className:'cd kc'},h('div',{className:'kl'},k.label),h('div',{className:'kv'},k.value));

    })),

    h('div',{className:'cg'},

      h('div',{className:'cd'},

        h('div',{style:{fontSize:14,fontWeight:500,marginBottom:16}},'Gasto mensual (\u00faltimos 6 meses)'),

        h('svg',{viewBox:'0 0 440 '+(chartH+40),style:{width:'100%',maxHeight:280}},

          chartData.map(function(d,i){

            var bh=Math.round((d.gasto/maxVal)*chartH);

            var x=20+i*(barW+8);

            return h('g',{key:i},

              h('rect',{x:x,y:chartH-bh+10,width:barW,height:bh,rx:3,fill:'var(--ac)'}),

              h('text',{x:x+barW/2,y:chartH+28,textAnchor:'middle',fill:'var(--tf)',fontSize:11},d.mes),

              h('text',{x:x+barW/2,y:chartH-bh+4,textAnchor:'middle',fill:'var(--tm)',fontSize:10},fmtUSD(d.gasto).replace('$',''))

            );

          })

        )

      ),

      h('div',{className:'cd'},

        h('div',{style:{fontSize:14,fontWeight:500,marginBottom:16}},'Alertas'),

        alerts.length===0

          ?h('div',{style:{fontSize:14,color:'var(--tf)'}},'Sin alertas activas.')

          :alerts.map(function(a,i){

            return h('div',{key:i,className:'ai'},

              h('span',{style:{flexShrink:0,marginTop:2,color:a.type==='danger'?'var(--er)':'var(--ac)'}},ic('triangle-exclamation',14)),

              h('span',null,a.text)

            );

  var s1=useState(null);var modal=s1[0],setModal=s1[1];



  function accName(id){var r=null;data.accounts.forEach(function(a){if(a.id===id)r=a});return r?r.name:id}



  function saveCred(c){

    if(c.id&&data.credits.some(function(x){return x.id===c.id})){

      update({credits:data.credits.map(function(x){return x.id===c.id?c:x})});

    }else{update({credits:data.credits.concat([Object.assign({},c,{id:uid()})])});}

    setModal(null);

  }



  return h('div',null,

    h('div',{className:'hr'},

      h('div',null,h('h1',{style:{fontSize:18,fontWeight:600}},'Cr\u00e9ditos AWS Activate'),h('p',{style:{fontSize:14,color:'var(--tm)'}},'Control de cr\u00e9ditos asignados por cuenta.')),

      h(Btn,{onClick:function(){setModal({mode:'new',credit:{accountId:'',total:0,startDate:'',endDate:'',consumed:0}})}},ic('plus',14),' Nuevo Cr\u00e9dito')

    ),

    h('div',{style:{display:'flex',flexDirection:'column',gap:12}},

      data.credits.map(function(c){

        var pctUsed=c.total>0?(c.consumed/c.total)*100:0;

        var remaining=c.total-c.consumed;

        var dLeft=daysUntil(c.endDate);

        var barColor=pctUsed>80?'var(--er)':pctUsed>50?'var(--ac)':'var(--ok)';

        return h('div',{key:c.id,className:'cd'},

          h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}},

            h('div',null,

              h('div',{style:{fontSize:15,fontWeight:600}},accName(c.accountId)),

              h('div',{style:{fontSize:12,color:'var(--tf)'}},fmtDate(c.startDate)+' \u2192 '+fmtDate(c.endDate))

            ),

            h('div',{style:{textAlign:'right'}},

              dLeft<=30?h(Badge,{tone:dLeft<0?'danger':'accent'},dLeft<0?'VENCIDO':dLeft+' d\u00edas'):h(Badge,{tone:'success'},dLeft+' d\u00edas')

            )

          ),

          h('div',{style:{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:8}},

            h('span',{style:{color:'var(--tm)'}},'Consumido: ',h('span',{className:'mono',style:{color:'var(--tx)'}},fmtUSD(c.consumed))),

            h('span',{style:{color:'var(--tm)'}},'Saldo: ',h('span',{className:'mono',style:{color:remaining/c.total<.2?'var(--er)':'var(--ok)'}},fmtUSD(remaining))),

            h('span',{style:{color:'var(--tm)'}},'Total: ',h('span',{className:'mono'},fmtUSD(c.total)))

          ),

          h('div',{className:'pb'},h('div',{className:'pf',style:{width:Math.min(pctUsed,100)+'%',background:barColor}})),

          h('div',{style:{fontSize:12,color:'var(--tf)',marginTop:4,textAlign:'right'}},pctUsed.toFixed(1)+'% consumido')

        );

      }),

      data.credits.length===0?h('div',{className:'cd',style:{textAlign:'center',color:'var(--tf)',padding:40}},'No hay cr\u00e9ditos registrados.'):null

    ),

    modal?h(Modal,{title:'Nuevo Cr\u00e9dito Activate',onClose:function(){setModal(null)}},

      h(CredForm,{credit:modal.credit,accounts:data.accounts,onSave:saveCred,onCancel:function(){setModal(null)}})):null

  );

}

/* ===== CONTROL CUENTAS ===== */

function ControlView(p){

  var data=p.data,update=p.update;

  var s1=useState('');var search=s1[0],setSearch=s1[1];

  var s2=useState('');var filterPma=s2[0],setFilterPma=s2[1];

  var s3=useState('all');var filterEstado=s3[0],setFilterEstado=s3[1];

  var s4=useState(null);var modal=s4[0],setModal=s4[1];

  var s5=useState(null);var delT=s5[0],setDelT=s5[1];

  var s6=useState('');var syncMsg=s6[0],setSyncMsg=s6[1];



  var cuentas=data.controlCuentas||[];

  /* Google Sheet — configuración gviz (lee columnas por nombre) */
  /* Apps Script Web App — devuelve JSON {rows:[{Cuenta Gmail, Alias, Cuenta AWS, PMA, AccountID, Estado, ...}]} */
  var SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbzfHVj2HLcm_c8Pgm7vZWel241W-GhxeiFaiLmfOxTFwDcwdzxXdysLUGo9YsV9rFlD/exec';

  /* Parser CSV simple que respeta comillas */
  function parseCSV(text){
    var rows=[];var row=[];var cur='';var inQ=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];var n=text[i+1];
      if(inQ){
        if(c==='"'&&n==='"'){cur+='"';i++;}
        else if(c==='"'){inQ=false;}
        else cur+=c;
      }else{
        if(c==='"')inQ=true;
        else if(c===','){row.push(cur);cur='';}
        else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
        else if(c==='\r'){}
        else cur+=c;
      }
    }
    if(cur!==''||row.length>0){row.push(cur);rows.push(row);}
    return rows;
  }

  /* Normaliza el estado de texto a los valores de la plataforma */
  function normEstado(e){
    if(!e)return 'Activa';
    var s=(''+e).trim().toLowerCase();
    if(s===''||s==='activa'||s==='active')return 'Activa';
    if(s==='deleted'||s==='eliminada'||s==='eliminar')return 'Eliminada';
    if(s==='suspeded'||s==='suspended'||s==='suspendida')return 'Suspendida';
    if(s.indexOf('migr')>=0||s==='ingram')return 'Migrada';
    if(s.indexOf('bt')>=0||s.indexOf('billing transfer')>=0)return 'BT';
    if(s.indexOf('revisar')>=0||s.indexOf('recuperar')>=0)return 'Revisar';
    return 'Activa';
  }

  async function syncFromSheet(){
    if(SHEET_API_URL.indexOf('PEGAR_AQUI')>=0){ setSyncMsg('Falta configurar la URL del script.'); return; }
    setSyncMsg('Sincronizando\u2026');
    try{
      var res=await fetch(SHEET_API_URL);
      var json=await res.json();
      var rows=json.rows||[];
      if(rows.length===0){ setSyncMsg('El Sheet no devolvi\u00f3 datos.'); return; }
      /* Detectar nombres de campo por coincidencia (los keys vienen del encabezado del Sheet) */
      var sample=rows[0];
      var keys=Object.keys(sample);
      function findKey(){var names=Array.prototype.slice.call(arguments);for(var j=0;j<names.length;j++){for(var k=0;k<keys.length;k++){if(keys[k].toLowerCase().indexOf(names[j])>=0)return keys[k];}}return null;}
      var kGmail=findKey('gmail','correo'),kAlias=findKey('alias'),kCuenta=findKey('cuenta aws','cuenta','nombre'),
          kPma=findKey('pma'),kId=findKey('accountid','account','id'),kEstado=findKey('estado','status'),kObs=findKey('obs','observ','nota');
      function val(row,key){ if(!key)return ''; var v=row[key]; return v==null?'':(''+v).trim(); }
      var arr=cuentas.slice();
      var actualizadas=0,agregadas=0;
      rows.forEach(function(row){
        var alias=val(row,kAlias),cuenta=val(row,kCuenta);
        if(!alias&&!cuenta)return;
        var accId=val(row,kId);
        if(accId.indexOf('.')>=0)accId=accId.split('.')[0];
        if(accId.indexOf('E')>=0||accId.indexOf('e')>=0){ var n=Number(row[kId]); if(!isNaN(n))accId=n.toFixed(0); }
        var rec={gmail:val(row,kGmail),alias:alias,cuentaAws:cuenta,pma:val(row,kPma),accountId:accId,estado:normEstado(val(row,kEstado)),obs:val(row,kObs)};
        var idx=-1;
        for(var q=0;q<arr.length;q++){
          if(accId&&arr[q].accountId===accId){idx=q;break;}
          if(!accId&&arr[q].alias===rec.alias&&rec.alias){idx=q;break;}
        }
        if(idx>=0){ rec.id=arr[idx].id; arr[idx]=rec; actualizadas++; }
        else { rec.id='ctrl-'+uid(); arr.push(rec); agregadas++; }
      });
      update({controlCuentas:arr});
      setSyncMsg('Sincronizado: '+actualizadas+' actualizadas, '+agregadas+' nuevas.');
    }catch(err){ setSyncMsg('Error al conectar con el script. Verifica que est\u00e9 implementado como "Cualquier usuario".'); }
  }

  /* get unique PMAs and estados */

  var pmaSet={};var estadoSet={};

  cuentas.forEach(function(c){if(c.pma)pmaSet[c.pma]=1;if(c.estado)estadoSet[c.estado]=1});

  var pmaList=Object.keys(pmaSet).sort();

  var estadoList=Object.keys(estadoSet).sort();



  var filtered=cuentas.filter(function(c){

    if(filterPma&&c.pma!==filterPma)return false;

    if(filterEstado!=='all'&&c.estado!==filterEstado)return false;

    if(search){

      var q=search.toLowerCase();

      if((c.alias+' '+c.cuentaAws+' '+c.accountId+' '+c.gmail+' '+c.obs).toLowerCase().indexOf(q)<0)return false;

    }

    return true;

  });



  /* stats */

  var totalActivas=0,totalElim=0,totalOtras=0;

  cuentas.forEach(function(c){

    if(c.estado==='Activa')totalActivas++;

    else if(c.estado==='Eliminada')totalElim++;

    else totalOtras++;

  });



  function saveCuenta(cuenta){

    var arr=cuentas.slice();

    if(cuenta.id){

      var idx=-1;arr.forEach(function(c,i){if(c.id===cuenta.id)idx=i});

      if(idx>=0)arr[idx]=cuenta;

      else arr.push(cuenta);

    }else{

      cuenta.id='ctrl-'+uid();

      arr.push(cuenta);

    }

    update({controlCuentas:arr});

    setModal(null);

  }

  function delCuenta(id){

    update({controlCuentas:cuentas.filter(function(c){return c.id!==id})});

    setDelT(null);

  }



  var emptyC={gmail:'',alias:'',cuentaAws:'',pma:'',accountId:'',estado:'Activa',obs:''};



  function estadoBadge(est){

    var tone='muted';

    if(est==='Activa')tone='success';

    else if(est==='Eliminada')tone='danger';

    else if(est==='Migrada'||est==='BT')tone='accent';

    else if(est==='Suspendida'||est==='Revisar')tone='danger';

    return h(Badge,{tone:tone},est);

  }



  return h('div',null,

    h('div',{className:'hr'},

      h('div',null,

        h('h1',{style:{fontSize:18,fontWeight:600}},'Control de Cuentas'),

        h('p',{style:{fontSize:14,color:'var(--tm)'}},'Registro de cuentas AWS — '+totalActivas+' activas, '+totalElim+' eliminadas, '+totalOtras+' otras')

      ),

      h('div',{style:{display:'flex',gap:8,alignItems:'center'}},
        syncMsg?h('span',{style:{fontSize:12,color:syncMsg.indexOf('Error')>=0||syncMsg.indexOf('Falta')>=0?'var(--er)':syncMsg.indexOf('Sincronizando')>=0?'var(--tm)':'var(--ok)'}},syncMsg):null,
        h(Btn,{variant:'ghost',onClick:syncFromSheet},ic('rotate',14),' Sincronizar Sheets'),
        h(Btn,{onClick:function(){setModal({mode:'new',cuenta:emptyC})}},ic('plus',14),' Nueva Cuenta')
      )

    ),

    /* Filtros */

    h('div',{className:'fb',style:{flexWrap:'wrap'}},

      h('input',{className:'ip',style:{maxWidth:250},placeholder:'Buscar alias, cuenta, ID\u2026',value:search,onChange:function(e){setSearch(e.target.value)}}),

      h('select',{className:'sl',style:{maxWidth:180},value:filterPma,onChange:function(e){setFilterPma(e.target.value)}},

        h('option',{value:''},'Todas las PMAs'),

        pmaList.map(function(p){return h('option',{key:p,value:p},p)})

      ),

      h('select',{className:'sl',style:{maxWidth:160},value:filterEstado,onChange:function(e){setFilterEstado(e.target.value)}},

        h('option',{value:'all'},'Todos los estados'),

        estadoList.map(function(e){return h('option',{key:e,value:e},e)})

      ),

      h('span',{style:{fontSize:12,color:'var(--tm)',marginLeft:8}},filtered.length+' de '+cuentas.length+' cuentas')

    ),

    /* Tabla */

    h('div',{className:'cd np'},

      h('div',{style:{overflowX:'auto'}},

        h('table',null,

          h('thead',null,h('tr',null,

            h('th',null,'Gmail'),h('th',null,'Alias'),h('th',null,'Cuenta AWS'),h('th',null,'PMA'),h('th',{style:{width:120}},'Account ID'),h('th',{style:{width:90}},'Estado'),h('th',null,'Obs'),h('th',{style:{width:60}},'')

          )),

          h('tbody',null,

            filtered.map(function(c){

              return h('tr',{key:c.id,style:{opacity:c.estado==='Eliminada'?0.5:1}},

                h('td',{style:{color:'var(--tm)',fontSize:13}},c.gmail),

                h('td',{style:{color:'var(--tx)',fontWeight:500}},c.alias),

                h('td',{style:{color:'var(--tx)'}},c.cuentaAws),

                h('td',null,h(Badge,{tone:'accent'},c.pma||'\u2014')),

                h('td',{className:'mono',style:{color:'var(--tm)',fontSize:12}},c.accountId||'\u2014'),

                h('td',null,estadoBadge(c.estado)),

                h('td',{style:{fontSize:12,color:'var(--tm)',maxWidth:200,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'},title:c.obs},c.obs||''),

                h('td',null,h('div',{className:'ax'},

                  h('button',{className:'ib',style:{color:'var(--tm)'},onClick:function(){setModal({mode:'edit',cuenta:Object.assign({},c)})}},ic('pen-to-square')),

                  h('button',{className:'ib',style:{color:'var(--er)'},onClick:function(){setDelT(c)}},ic('trash'))

                ))

              );

            }),

            filtered.length===0?h('tr',null,h('td',{colSpan:8,style:{textAlign:'center',padding:'32px 16px',color:'var(--tf)'}},'No hay cuentas que coincidan.')):null

          )

        )

      )

    ),

    modal?h(Modal,{title:modal.mode==='new'?'Nueva Cuenta':'Editar Cuenta',onClose:function(){setModal(null)}},

      h(CtrlForm,{cuenta:modal.cuenta,pmaList:pmaList,onSave:saveCuenta,onCancel:function(){setModal(null)}})):null,

    delT?h(ConfirmDel,{label:delT.alias||delT.cuentaAws,onConfirm:function(){delCuenta(delT.id)},onCancel:function(){setDelT(null)}}):null

  );

}

function ChecklistView(p){

  var data=p.data,update=p.update;

  var today=new Date();

  var defMonth=today.getFullYear()+'-'+(today.getMonth()+1<10?'0':'')+(today.getMonth()+1);

  var s1=useState(defMonth);var selMonth=s1[0],setSelMonth=s1[1];



  /* asegurar que checklists existe en data */

  var checklists=data.checklists;

  if(!checklists || typeof checklists!=='object'){

    checklists={};

  }

  var cl=checklists[selMonth];

  /* si el checklist existe pero tiene arrays vacios, rellenarlo */

  if(cl && cl.consumos && cl.consumos.length===0){

    cl=null; /* forzar recreacion */

  }



  function createMonth(){

    var tpl=data.checklistTemplate||DEFAULT_CHECKLIST_TEMPLATE;

    var copy=JSON.parse(JSON.stringify(tpl));

    var next=Object.assign({},checklists);

    next[selMonth]=copy;

    update({checklists:next});

  }



  function updateCL(patch){

    var next=Object.assign({},checklists);

    next[selMonth]=Object.assign({},cl,patch);

    update({checklists:next});

  }



  /* toggle helpers */

  function toggleConsumo(idx,field){

    var arr=cl.consumos.slice();

    arr[idx]=Object.assign({},arr[idx]);arr[idx][field]=!arr[idx][field];

    updateCL({consumos:arr});

  }

  function setConsumoObs(idx,val){

    var arr=cl.consumos.slice();

    arr[idx]=Object.assign({},arr[idx]);arr[idx].obs=val;

    updateCL({consumos:arr});

  }

  function toggleFactura(idx){

    var arr=cl.facturas.slice();

    arr[idx]=Object.assign({},arr[idx]);arr[idx].done=!arr[idx].done;

    updateCL({facturas:arr});

  }

  function setFacturaObs(idx,val){

    var arr=cl.facturas.slice();

    arr[idx]=Object.assign({},arr[idx]);arr[idx].obs=val;

    updateCL({facturas:arr});

  }

  function toggleProforma(idx){

    var arr=cl.proformas.slice();

    arr[idx]=Object.assign({},arr[idx]);arr[idx].done=!arr[idx].done;

/* ===== TAREAS (Google Tasks style) ===== */
function TasksView(p){
  var data=p.data,update=p.update;
  var s1=useState(null);var modal=s1[0],setModal=s1[1];
  var s2=useState('all');var filterList=s2[0],setFilterList=s2[1];
  var s3=useState(false);var showDone=s3[0],setShowDone=s3[1];
  var s4=useState(null);var listModal=s4[0],setListModal=s4[1];
  var s5=useState(null);var delT=s5[0],setDelT=s5[1];

  var lists=data.taskLists||[];
  var tasks=data.tasks||[];

  /* Importar tareas desde Google Tasks (Takeout JSON) */
  function importGoogleTasks(e){
    var file=e.target.files&&e.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(ev){
      try{
        var g=JSON.parse(ev.target.result);
        var gLists=g.items||[];
        var colors=['var(--ac)','var(--in)','var(--ok)','var(--er)','#9b59b6','#1abc9c','#e67e22'];
        var newLists=lists.slice();
        var newTasks=tasks.slice();
        var importadas=0;
        gLists.forEach(function(gl,li){
          /* buscar si ya existe una lista con ese nombre */
          var existing=null;
          newLists.forEach(function(l){if(l.name===gl.title)existing=l});
          var listId;
          if(existing){ listId=existing.id; }
          else {
            listId='tl-'+uid();
            newLists.push({id:listId,name:gl.title||'Lista importada',color:colors[newLists.length%colors.length]});
          }
          (gl.items||[]).forEach(function(t){
            var due=t.due?t.due.slice(0,10):'';
            newTasks.push({
              id:'tsk-'+uid(),
              listId:listId,
              title:t.title||'(sin t\u00edtulo)',
              desc:t.notes||'',
              priority:t.starred?'alta':'media',
              dueDate:due,
              done:t.status==='completed',
              createdAt:(t.created||'').slice(0,10)
            });
            importadas++;
          });
        });
        update({taskLists:newLists,tasks:newTasks});
        alert('Se importaron '+importadas+' tareas de Google Tasks en '+gLists.length+' lista(s).');
      }catch(err){alert('No se pudo leer el archivo de Google Tasks. \u00bfEs el Tasks.json de Google Takeout?')}
    };
    reader.readAsText(file);e.target.value='';
  }

  var filtered=tasks.filter(function(t){
    if(filterList!=='all'&&t.listId!==filterList)return false;
    if(!showDone&&t.done)return false;
    return true;
  });

  /* Sort: incomplete first, then by priority, then by dueDate */
  var prioOrder={alta:0,media:1,baja:2,'':3};
  filtered.sort(function(a,b){
    if(a.done!==b.done)return a.done?1:-1;
    var pa=prioOrder[a.priority]||3,pb=prioOrder[b.priority]||3;
    if(pa!==pb)return pa-pb;
    if(a.dueDate&&b.dueDate)return a.dueDate>b.dueDate?1:-1;
    if(a.dueDate)return -1;if(b.dueDate)return 1;
    return 0;
  });

  function toggleTask(id){
    update({tasks:tasks.map(function(t){return t.id===id?Object.assign({},t,{done:!t.done}):t})});
  }
  function saveTask(task){
    if(task.id&&tasks.some(function(t){return t.id===task.id})){
      update({tasks:tasks.map(function(t){return t.id===task.id?task:t})});
    }else{
      task.id='tsk-'+uid();task.createdAt=new Date().toISOString().slice(0,10);
      update({tasks:tasks.concat([task])});
    }
    setModal(null);
  }
  function delTask(id){update({tasks:tasks.filter(function(t){return t.id!==id})});setDelT(null)}
  function saveList(list){
    if(list.id&&lists.some(function(l){return l.id===list.id})){
      update({taskLists:lists.map(function(l){return l.id===list.id?list:l})});
    }else{
      list.id='tl-'+uid();
      update({taskLists:lists.concat([list])});
    }
    setListModal(null);
  }
  function delList(id){
    update({taskLists:lists.filter(function(l){return l.id!==id}),tasks:tasks.filter(function(t){return t.listId!==id})});
    if(filterList===id)setFilterList('all');
    setListModal(null);
  }

  function listName(id){var l=null;lists.forEach(function(x){if(x.id===id)l=x});return l?l.name:'Sin lista'}
  function listColor(id){var l=null;lists.forEach(function(x){if(x.id===id)l=x});return l?l.color:'var(--tm)'}

  function prioBadge(p){
    var tone=p==='alta'?'danger':p==='media'?'accent':'muted';
    var label=p==='alta'?'Alta':p==='media'?'Media':p==='baja'?'Baja':'';
    return label?h(Badge,{tone:tone},label):null;
  }

  var pendientes=0,completadas=0;
  tasks.forEach(function(t){if(t.done)completadas++;else pendientes++});

  var emptyTask={listId:filterList!=='all'?filterList:(lists[0]?lists[0].id:''),title:'',desc:'',priority:'media',dueDate:'',done:false};

  return h('div',null,
    h('div',{className:'hr'},
      h('div',null,
        h('h1',{style:{fontSize:18,fontWeight:600}},'Tareas'),
        h('p',{style:{fontSize:14,color:'var(--tm)'}},pendientes+' pendientes \u00b7 '+completadas+' completadas')
      ),
      h('div',{style:{display:'flex',gap:8}},
        h('label',{style:{display:'inline-flex',alignItems:'center',gap:6,fontSize:14,fontWeight:500,padding:'8px 12px',borderRadius:6,border:'1px solid var(--bd)',color:'var(--tx)',cursor:'pointer'},title:'Importar desde Google Tasks (Takeout JSON)'},
          ic('file-import',14),' Google Tasks',
          h('input',{type:'file',accept:'application/json,.json',style:{display:'none'},onChange:importGoogleTasks})
        ),
        h(Btn,{variant:'ghost',onClick:function(){setListModal({mode:'new',list:{name:'',color:'var(--ac)'}})}},ic('folder-plus',14),' Lista'),
        h(Btn,{onClick:function(){setModal({mode:'new',task:emptyTask})}},ic('plus',14),' Tarea')
      )
    ),

    /* Filtros */
    h('div',{className:'fb',style:{flexWrap:'wrap'}},
      h('button',{className:'bt '+(filterList==='all'?'bt-p':'bt-g'),style:{fontSize:13,padding:'6px 12px'},onClick:function(){setFilterList('all')}},'Todas'),
      lists.map(function(l){
        return h('button',{key:l.id,className:'bt '+(filterList===l.id?'bt-p':'bt-g'),style:{fontSize:13,padding:'6px 12px',borderColor:filterList===l.id?l.color:'var(--bd)',color:filterList===l.id?'#1A1204':l.color,background:filterList===l.id?l.color:'transparent'},onClick:function(){setFilterList(l.id)}},
          l.name,
          h('button',{className:'ib',style:{color:'inherit',marginLeft:4,fontSize:10},onClick:function(e){e.stopPropagation();setListModal({mode:'edit',list:Object.assign({},l)})}},ic('pen',10))
        );
      }),
      h('label',{style:{display:'flex',alignItems:'center',gap:6,fontSize:13,color:'var(--tm)',marginLeft:'auto',cursor:'pointer'}},
        h('input',{type:'checkbox',checked:showDone,onChange:function(){setShowDone(!showDone)},style:{accentColor:'var(--ac)'}}),
        'Mostrar completadas'
      )
    ),

    /* Task list */
    h('div',{style:{display:'flex',flexDirection:'column',gap:8,marginTop:8}},
      filtered.length===0?h('div',{className:'cd',style:{textAlign:'center',padding:40,color:'var(--tf)'}},
        ic('clipboard-check',28),h('p',{style:{marginTop:8,fontSize:14}},showDone?'No hay tareas.':'No hay tareas pendientes.')
      ):null,
      filtered.map(function(t){
        var isOverdue=t.dueDate&&!t.done&&t.dueDate<new Date().toISOString().slice(0,10);
        return h('div',{key:t.id,className:'cd',style:{padding:'14px 16px',opacity:t.done?0.55:1,borderLeft:'3px solid '+listColor(t.listId)}},
          h('div',{style:{display:'flex',alignItems:'flex-start',gap:12}},
            h('button',{onClick:function(){toggleTask(t.id)},style:{
              width:22,height:22,borderRadius:6,border:'2px solid '+(t.done?'var(--ok)':'var(--bl)'),
              background:t.done?'var(--ok)':'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,padding:0,marginTop:1
            }},t.done?h('i',{className:'fa-solid fa-check',style:{fontSize:12,color:'#fff'}}):null),
            h('div',{style:{flex:1,minWidth:0}},
              h('div',{style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}},
                h('span',{style:{fontSize:15,fontWeight:500,color:t.done?'var(--tm)':'var(--tx)',textDecoration:t.done?'line-through':'none'}},t.title),
                prioBadge(t.priority),
                h('span',{className:'bg bg-mt',style:{fontSize:11}},listName(t.listId))
              ),
              t.desc?h('p',{style:{fontSize:13,color:'var(--tm)',marginTop:4}},t.desc):null,
              t.dueDate?h('div',{style:{fontSize:12,marginTop:6,display:'flex',alignItems:'center',gap:4,color:isOverdue?'var(--er)':'var(--tf)'}},
                ic('calendar',11),h('span',null,t.dueDate),isOverdue?h('span',{style:{color:'var(--er)',fontWeight:600}},' \u00b7 Vencida'):null
              ):null
            ),
            h('div',{style:{display:'flex',gap:4,flexShrink:0}},
              h('button',{className:'ib',style:{color:'var(--tm)'},onClick:function(){setModal({mode:'edit',task:Object.assign({},t)})}},ic('pen-to-square',13)),
              h('button',{className:'ib',style:{color:'var(--er)'},onClick:function(){setDelT(t)}},ic('trash',13))
            )
          )
        );
      })
    ),

    modal?h(Modal,{title:modal.mode==='new'?'Nueva Tarea':'Editar Tarea',onClose:function(){setModal(null)}},
      h(TaskForm,{task:modal.task,lists:lists,onSave:saveTask,onCancel:function(){setModal(null)}})):null,
    listModal?h(Modal,{title:listModal.mode==='new'?'Nueva Lista':'Editar Lista',onClose:function(){setListModal(null)}},
      h(ListForm,{list:listModal.list,onSave:saveList,onDelete:listModal.mode==='edit'?function(){delList(listModal.list.id)}:null,onCancel:function(){setListModal(null)}})):null,
    delT?h(ConfirmDel,{label:delT.title,onConfirm:function(){delTask(delT.id)},onCancel:function(){setDelT(null)}}):null
  );
}
function TaskForm(p){
  var s=useState(p.task);var form=s[0],setForm=s[1];
  function set(k,v){var n=Object.assign({},form);n[k]=v;setForm(n)}
  return h('form',{onSubmit:function(e){e.preventDefault();if(form.title)p.onSave(form)}},
    h(Field,{label:'T\u00edtulo'},h('input',{className:'ip',required:true,value:form.title,placeholder:'Qu\u00e9 necesitas hacer?',onChange:function(e){set('title',e.target.value)}})),
    h(Field,{label:'Descripci\u00f3n (opcional)'},h('textarea',{className:'ta',value:form.desc,placeholder:'Detalles adicionales...',onChange:function(e){set('desc',e.target.value)}})),
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}},
      h(Field,{label:'Lista'},h('select',{className:'sl',value:form.listId,onChange:function(e){set('listId',e.target.value)}},
        p.lists.map(function(l){return h('option',{key:l.id,value:l.id},l.name)})
      )),
      h(Field,{label:'Prioridad'},h('select',{className:'sl',value:form.priority,onChange:function(e){set('priority',e.target.value)}},
        h('option',{value:'alta'},'Alta'),h('option',{value:'media'},'Media'),h('option',{value:'baja'},'Baja')
      ))
    ),
    h(Field,{label:'Fecha l\u00edmite (opcional)'},h('input',{className:'ip',type:'date',value:form.dueDate,onChange:function(e){set('dueDate',e.target.value)}})),
    h('div',{className:'fe',style:{marginTop:16}},h(Btn,{variant:'ghost',onClick:p.onCancel},'Cancelar'),h(Btn,{type:'submit'},'Guardar'))
  );
}
function ListForm(p){
  var s=useState(p.list);var form=s[0],setForm=s[1];
  function set(k,v){var n=Object.assign({},form);n[k]=v;setForm(n)}
  var colors=['var(--ac)','var(--ok)','var(--in)','var(--er)','#9b59b6','#1abc9c','#e67e22','#95a5a6'];
  return h('form',{onSubmit:function(e){e.preventDefault();if(form.name)p.onSave(form)}},
    h(Field,{label:'Nombre de la lista'},h('input',{className:'ip',required:true,value:form.name,onChange:function(e){set('name',e.target.value)}})),
    h(Field,{label:'Color'},h('div',{style:{display:'flex',gap:8,flexWrap:'wrap'}},
      colors.map(function(c){
        return h('button',{key:c,type:'button',onClick:function(){set('color',c)},style:{
          width:28,height:28,borderRadius:6,background:c,border:form.color===c?'2px solid var(--tx)':'2px solid transparent',cursor:'pointer'
        }});
      })

/* ===== MAIN APP ===== */

function App(){

  var initial = loadData() || buildDemo();

  var s1=useState(initial);var data=s1[0],setData=s1[1];

  var s2=useState('dashboard');var tab=s2[0],setTab=s2[1];

  var s3=useState(null);var pmaFilter=s3[0],setPmaFilter=s3[1];

  var s9=useState(false);var ready=s9[0],setReady=s9[1];

  var s10=useState(sb?'sync':'local');var cloudStatus=s10[0],setCloudStatus=s10[1];

  /* Al iniciar: cargar desde la nube (Supabase). Si hay datos, usarlos. */
  useEffect(function(){
    if(!sb){ setCloudStatus('local'); return; }
    (async function(){
      try{
        var cloud = await loadFromCloud();
        if(cloud){ setData(cloud); }
        else { await saveToCloud(initial); } /* sembrar la nube con los datos base la primera vez */
        setCloudStatus('ok');
      }catch(e){ setCloudStatus('error'); }
    })();
  },[]);



  /* Guardar automáticamente cada vez que cambian los datos — en localStorage Y en la nube */

  useEffect(function(){
    if(!ready){setReady(true);return;}
    saveData(data);
    if(sb){ setCloudStatus('saving'); saveToCloud(data).then(function(){ setCloudStatus('ok'); }).catch(function(){ setCloudStatus('error'); }); }
  },[data]);



  function update(patch){setData(function(prev){var next=Object.assign({},prev,patch);return next})}

  function goAccPma(id){setPmaFilter(id);setTab('accounts')}



  function exportJSON(){

    var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});

    var url=URL.createObjectURL(blob);var a=document.createElement('a');

    a.href=url;a.download='cnid-cloud-backup-'+new Date().toISOString().slice(0,10)+'.json';

    a.click();URL.revokeObjectURL(url);

  }

  function importJSON(e){

    var file=e.target.files&&e.target.files[0];if(!file)return;

    var reader=new FileReader();

    reader.onload=function(ev){
      try{
        var imported=JSON.parse(ev.target.result);
        var base=buildDemo();
        /* Combinar: PMAs, cuentas y costos del HTML base + progreso del JSON importado */
        var merged=Object.assign({},base);
        /* Mantener PMAs/cuentas/costos del base (HTML) */
        /* Traer checklists, notas, controlCuentas y clientes del JSON importado */
        if(imported.checklists)merged.checklists=imported.checklists;
        if(imported.checklistTemplate)merged.checklistTemplate=imported.checklistTemplate;
        if(imported.controlCuentas&&imported.controlCuentas.length>0)merged.controlCuentas=imported.controlCuentas;
        if(imported.clients&&imported.clients.length>0)merged.clients=imported.clients;
        if(imported.credits&&imported.credits.length>0)merged.credits=imported.credits;
        if(imported.taskLists)merged.taskLists=imported.taskLists;
        if(imported.tasks)merged.tasks=imported.tasks;
        if(imported.movements&&imported.movements.length>0)merged.movements=imported.movements;
        /* Si el JSON tiene PMAs propias (agregadas por el usuario), combinarlas */
        if(imported.pmas){
          var baseIds={};merged.pmas.forEach(function(p){baseIds[p.id]=1});
          imported.pmas.forEach(function(p){if(!baseIds[p.id])merged.pmas.push(p)});
        }
        if(imported.accounts){
          var baseAccIds={};merged.accounts.forEach(function(a){baseAccIds[a.id]=1});
          imported.accounts.forEach(function(a){if(!baseAccIds[a.id])merged.accounts.push(a)});
        }
        setData(merged);
        alert('Importado correctamente. Se combinaron los datos del JSON con las PMAs base.');
      }catch(err){alert('El archivo no es un JSON v\u00e1lido.')}
    };

    reader.readAsText(file);e.target.value='';

  }

  function doReset(){

    if(confirm('\u00bfResetear todos los datos y cargar los datos base? Los cambios no guardados con Exportar se perder\u00e1n.')){

      var fresh=resetData();setData(fresh);

    }

  }



  return h('div',{className:'app'},

    h('aside',{className:'sb'},

      h('div',{className:'sb-hd'},

        h('div',{className:'sb-t'},'CNID Cloud Ops'),

        h('div',{className:'sb-st'},'Gesti\u00f3n de cuentas AWS \u00b7 SPP')
        ,
        h('div',{style:{marginTop:8,fontSize:11,display:'flex',alignItems:'center',gap:5,color:cloudStatus==='error'?'var(--er)':cloudStatus==='ok'?'var(--ok)':'var(--tm)'}},
          ic(cloudStatus==='saving'?'cloud-arrow-up':cloudStatus==='error'?'cloud-bolt':cloudStatus==='local'?'hard-drive':'cloud',11),
          h('span',null, cloudStatus==='saving'?'Guardando…':cloudStatus==='ok'?'Sincronizado':cloudStatus==='error'?'Error de conexión':cloudStatus==='local'?'Solo local':'Conectando…')
        )

      ),

      h('nav',{className:'sb-nav'},

        NAV.map(function(n){

          return h('button',{key:n.key,className:'nb'+(tab===n.key?' on':''),onClick:function(){setTab(n.key);if(n.key!=='accounts')setPmaFilter(null)}},

            ic(n.icon,16),h('span',{className:'nl'},n.label));

        })

      ),

      h('div',{className:'sb-ft'},

        h(Btn,{variant:'ghost',onClick:exportJSON,style:{justifyContent:'center',width:'100%'}},ic('download',14),' Exportar'),

        h('label',{style:{display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,fontSize:14,fontWeight:500,padding:'8px 12px',borderRadius:6,border:'1px solid var(--bd)',color:'var(--tx)',cursor:'pointer',width:'100%'}},

          ic('upload',14),' Importar',

          h('input',{type:'file',accept:'application/json',style:{display:'none'},onChange:importJSON})

        ),

        h(Btn,{variant:'ghost',onClick:doReset,style:{justifyContent:'center',width:'100%',fontSize:12,color:'var(--er)'}},ic('rotate',12),' Reset datos')

      )

    ),

    h('main',{className:'mn'},

      tab==='dashboard'?h(DashboardView,{data:data,onNav:setTab}):null,

      tab==='pmas'?h(PmasView,{data:data,update:update,onViewAccounts:goAccPma}):null,

      tab==='accounts'?h(AccountsView,{data:data,update:update,pmaFilter:pmaFilter,clearFilter:function(){setPmaFilter(null)}}):null,

      tab==='clients'?h(ClientsView,{data:data,update:update}):null,

      tab==='costs'?h(CostsView,{data:data,update:update}):null,

      tab==='credits'?h(CreditsView,{data:data,update:update}):null,

      tab==='checklist'?h(ChecklistView,{data:data,update:update}):null,

      tab==='control'?h(ControlView,{data:data,update:update}):null,
      tab==='tasks'?h(TasksView,{data:data,update:update}):null

    )

  );

}



ReactDOM.createRoot(document.getElementById('root')).render(h(App));

</script>
